<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f7f7f4">
  <title>Qur'an — Read & Reflect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html">Qur'an</a>
    <div class="top-actions">
      <button id="langBtn" class="icon-btn" aria-label="Switch language">EN</button>
      <button id="themeBtn" class="icon-btn" aria-label="Toggle theme">☾</button>
    </div>
  </header>

  <main>
    <section class="hero">
      <p class="eyebrow">بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ</p>
      <h1>Read the Qur'an.</h1>
      <p class="subtitle">A simple, distraction-free Qur'an reader.</p>

      <div class="search-wrap">
        <input id="searchInput" type="search" placeholder="Search surahs..." autocomplete="off">
      </div>
    </section>

    <section class="continue-card" id="continueCard" hidden>
      <div>
        <span class="eyebrow">CONTINUE READING</span>
        <h2 id="continueTitle">—</h2>
        <p id="continueMeta">—</p>
      </div>
      <button id="continueBtn" class="primary-btn">Continue</button>
    </section>

    <section class="surah-section">
      <div class="section-heading">
        <div>
          <span class="eyebrow">THE QUR'AN</span>
          <h2>Surahs</h2>
        </div>
        <span id="surahCount" class="muted">Loading...</span>
      </div>
      <div id="surahList" class="surah-list">
        <div class="loading">Loading surahs...</div>
      </div>
    </section>
  </main>

  <footer>Built with HTML, CSS & JavaScript.</footer>
  <script src="js/app.js"></script>
</body>
</html>
